version: '3.8'

services:
  db:
    image: postgres:15
    container_name: navops-db
    restart: always
    environment:
      POSTGRES_DB: navops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2102
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
