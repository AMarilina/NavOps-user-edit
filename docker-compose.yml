version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: navops-db
    environment:
      POSTGRES_USER: navops_user
      POSTGRES_PASSWORD: 2102
      POSTGRES_DB: navops
    ports:
      - "5432:5432"
    volumes:
      - navops-pgdata:/var/lib/postgresql/data
      # Instanciación automática del script SQL
      - "./data base/navops.sql:/docker-entrypoint-initdb.d/navops.sql"
    restart: always

volumes:
  navops-pgdata:
